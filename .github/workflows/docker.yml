name: docker
# Builds the jobsearchPal images for amd64 and arm64 (each on its own runner, no emulation) and publishes them to
# GitHub's registry: ghcr.io/palstack-io/jobsearchpal, plus the optional "Finish it here" browser box
# (jobsearchpal-finish) and its proxy (jobsearchpal-finish-proxy). A push to main updates :main; a tag v1.2.3
# publishes :1.2.3, :1.2 and :latest. docker-compose.yml pulls :latest unless you build locally with --build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io/palstack-io
jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
        image:
          - {name: jobsearchpal, context: ., about: "jobsearchPal: your job search and the unemployment paperwork, on your own computer"}
          - {name: jobsearchpal-finish, context: finish-box/box, about: "jobsearchPal browser box for Finish it here"}
          - {name: jobsearchpal-finish-proxy, context: finish-box/proxy, about: "jobsearchPal outbound proxy for the browser box"}
        include:
          - {arch: amd64, platform: linux/amd64, runner: ubuntu-24.04}
          - {arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version for the image
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.image.about }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch }}
      - name: Save the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image.name }}--${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [jobsearchpal, jobsearchpal-finish, jobsearchpal-finish-proxy]
    env:
      IMAGE: ghcr.io/palstack-io/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}--*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: latest=auto
      - name: One tag for both architectures
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Show it
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
