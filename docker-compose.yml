# jobsearchPal with Docker. From the repo folder:
#   docker compose up -d            (pulls the published image, ghcr.io/palstack-io/jobsearchpal)
#   docker compose up -d --build    (or builds it here from the Dockerfile)
# Pin a version with JSP_VERSION in .env (e.g. JSP_VERSION=1.0.0); the default is the latest release.
# If your user id isn't 1000 (check with: id -u), add APP_UID and APP_GID to .env first.
# Sign in to your agent once (either or both; details in docs/setup.md, "Signing in to your AI subscription"):
#   docker compose run --rm web claude                     (then /login, and trust the /app folder)
#   docker compose run --rm web claude setup-token         (or this: put the token in .env as CLAUDE_CODE_OAUTH_TOKEN)
#   docker compose run --rm web codex login --device-auth  (or copy ~/.codex/auth.json from a signed-in machine)
# Your config.yaml, profile.yaml, .env, CLAUDE.local.md, materials/ and data/ stay in this folder.
x-app: &app
  build: .
  image: ghcr.io/palstack-io/jobsearchpal:${JSP_VERSION:-latest}
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  env_file: [{path: .env, required: false}]
  environment:
    TZ: ${TZ:-America/New_York}
  volumes:
    - .:/app
    - agent-home:/home/app        # Claude Code / Codex logins
  restart: unless-stopped

services:
  web:
    <<: *app
    command: ["autoapply", "serve"]
    ports:
      # Only this machine by default. Set BIND to your Tailscale IP to reach it from your phone.
      - "${BIND:-127.0.0.1}:${PORT:-8787}:8787"
  scheduler:
    <<: *app
    command: ["python3", "scripts/scheduler.py"]
    environment:
      TZ: ${TZ:-America/New_York}
      DAILY_AT: ${DAILY_AT:-06:30}
      DAILY_DAYS: ${DAILY_DAYS:-1-5}

volumes:
  agent-home:
