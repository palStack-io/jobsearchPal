# jobsearchPal with Docker. From the repo folder:
#   docker compose up -d            (pulls the published image, ghcr.io/palstack-io/jobsearchpal)
#   docker compose up -d --build    (or builds it here from the Dockerfile)
# Pin a version with JSP_VERSION in .env (e.g. JSP_VERSION=1.1.0); the default is the latest release.
# If your user id isn't 1000 (check with: id -u), add APP_UID and APP_GID to .env first.
# Sign in to your agent once (either or both; details in docs/setup.md, "Signing in to your AI subscription"):
#   docker compose run --rm web claude                     (then /login, and trust the /app folder)
#   docker compose run --rm web claude setup-token         (or this: put the token in .env as CLAUDE_CODE_OAUTH_TOKEN)
#   docker compose run --rm web codex login --device-auth  (or copy ~/.codex/auth.json from a signed-in machine)
# Your config.yaml, profile.yaml, .env, CLAUDE.local.md, materials/ and data/ stay in this folder.
x-app: &app
  build: .
  image: ghcr.io/palstack-io/jobsearchpal:${JSP_VERSION:-latest}
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  env_file: [{path: .env, required: false}]
  environment:
    TZ: ${TZ:-America/New_York}
  volumes:
    - .:/app
    - agent-home:/home/app        # Claude Code / Codex logins
  restart: unless-stopped

services:
  web:
    <<: *app
    command: ["autoapply", "serve"]
    ports:
      # Only this machine by default. Set BIND to your Tailscale IP to reach it from your phone.
      - "${BIND:-127.0.0.1}:${PORT:-8787}:8787"
    networks: [default, finish-inner]
  scheduler:
    <<: *app
    command: ["python3", "scripts/scheduler.py"]
    environment:
      TZ: ${TZ:-America/New_York}
      DAILY_AT: ${DAILY_AT:-06:30}
      DAILY_DAYS: ${DAILY_DAYS:-1-5}
  # "Finish it here" (optional): a browser on this server you use from the job page. Turn it on with
  #   docker compose --profile finish up -d
  # then Setup, "Finish applications in the browser". Neither publishes a port; the browser reaches the web only
  # through finish-proxy, which refuses home, tailnet and Docker addresses.
  finish:
    image: ghcr.io/palstack-io/jobsearchpal-finish:${JSP_VERSION:-latest}
    build: {context: finish-box/box}
    profiles: ["finish"]
    shm_size: 1gb
    networks: [finish-inner]
    restart: unless-stopped
  finish-proxy:
    image: ghcr.io/palstack-io/jobsearchpal-finish-proxy:${JSP_VERSION:-latest}
    build: {context: finish-box/proxy}
    profiles: ["finish"]
    networks: [default, finish-inner]
    restart: unless-stopped

networks:
  # Internal: nothing on it can reach the internet except through finish-proxy. A small fixed range, so it starts
  # where Docker's default pools are used up; set FINISH_INNER_SUBNET in .env if it clashes.
  finish-inner:
    internal: true
    ipam: {config: [{subnet: "${FINISH_INNER_SUBNET:-10.251.17.32/28}"}]}

volumes:
  agent-home:
