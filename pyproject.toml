[project]
name = "autoapply"
version = "1.0.0"
description = "Self-hosted job application assistant: find, rank, tailor, fill, then you review and submit."
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "httpx>=0.27",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-docx>=1.1",
  "pypdf>=4",
  "python-multipart>=0.0.9",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
autoapply = "autoapply.cli:main"

[tool.setuptools.packages.find]
include = ["autoapply*"]

[tool.setuptools.package-data]
autoapply = ["fillers/scan.js", "templates/*.html", "work_search_states.yaml", "market.yaml", "static/fonts/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
